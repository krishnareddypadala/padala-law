<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Padala Law — LL.B Audio Revision</title>
<meta name="description" content="Story-based Telugu audio revision and exam notes for LL.B semesters IV and V: International Law, Labour Law, Taxation, IPR, Land Laws, Evidence and more.">
<meta name="theme-color" content="#0b1120">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
<style>
:root{
  --bg:#0b1120; --panel:#111a2e; --panel2:#16223c; --line:#22304f;
  --txt:#e8eefc; --dim:#94a3c4; --accent:#facc15; --accent2:#38bdf8; --ok:#4ade80;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Telugu",sans-serif;
  padding-bottom:130px;line-height:1.5}
header{padding:20px 18px 12px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#101a30,#0b1120)}
h1{margin:0;font-size:21px;letter-spacing:.3px}
h1 span{color:var(--accent)}
.sub{color:var(--dim);font-size:13px;margin-top:4px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.resume{display:none;margin:14px 0 2px;background:var(--panel2);border:1px solid var(--accent);
  border-radius:12px;padding:12px 14px;cursor:pointer}
.resume.show{display:block}
.resume .lbl{font-size:11px;color:var(--accent);letter-spacing:.6px;text-transform:uppercase}
.resume .ttl{font-weight:600;font-size:14.5px;margin-top:3px}
.resume .meta{font-size:12px;color:var(--dim);margin-top:2px}
.semtabs{display:flex;gap:8px;padding:14px 16px 0}
.semtab{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--dim);
  padding:7px 14px;border-radius:9px;font-size:13px;cursor:pointer;display:flex;flex-direction:column;gap:1px;line-height:1.25}
.semtab.on{border-color:var(--accent2);color:var(--txt);background:var(--panel)}
.semtab small{font-size:10.5px;opacity:.8}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--dim);
  padding:8px 14px;border-radius:999px;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:.15s;
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;line-height:1.25}
.tab:hover{border-color:#3b4d78}
.tab.on{background:var(--accent);color:#111;border-color:var(--accent);font-weight:600}
.tab small{font-size:10.5px;opacity:.8}
.subhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 0 10px;font-size:12.5px;color:var(--dim)}
.subhead .paper{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:3px 8px}
.subhead .opt{color:var(--accent2)}
.subhead .warn{color:var(--accent)}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:999px;
  padding:5px 11px;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.list{padding:4px 0 20px}
.card{display:flex;gap:13px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);
  border-radius:13px;padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.card:hover{background:var(--panel2);border-color:#3b4d78}
.card.on{border-color:var(--accent);background:var(--panel2)}
.card.done{border-color:#2a4a38}
.bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0;transition:width .3s}
.card.done .bar{background:var(--ok)}
.num{flex:0 0 34px;height:34px;border-radius:9px;background:#1e2b4a;color:var(--accent2);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.card.on .num{background:var(--accent);color:#111}
.card.done .num{background:#14351f;color:var(--ok)}
.meta{flex:1;min-width:0}
.t{font-weight:600;font-size:15px;margin-bottom:2px}
.s{color:var(--dim);font-size:12.5px}
.stat{font-size:11.5px;color:var(--dim);margin-top:4px}
.stat b{color:var(--accent);font-weight:600}
.card.done .stat b{color:var(--ok)}
.stat .soon{color:var(--accent2)}
.btns{display:flex;flex-direction:column;gap:5px;flex:0 0 auto;margin-top:2px}
.ic{color:var(--dim);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:3px 7px;text-align:center}
.ic:hover{color:var(--accent);border-color:var(--accent)}
.player{position:fixed;left:0;right:0;bottom:0;background:rgba(13,20,38,.97);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 16px 14px;z-index:50}
.pinner{max-width:900px;margin:0 auto}
.now{font-size:13.5px;font-weight:600;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nowsub{font-size:11.5px;color:var(--dim);margin-bottom:7px}
audio{width:100%;height:38px}
.tools{display:flex;justify-content:space-between;align-items:center;margin-top:8px;
  font-size:11.5px;color:var(--dim);flex-wrap:wrap;gap:6px}
.tools button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:7px;
  padding:4px 9px;font-size:11.5px;cursor:pointer}
.tools button:hover{color:var(--txt);border-color:#3b4d78}
.tools button.lang{color:var(--accent2);border-color:#2a4d6e}
.modal{position:fixed;inset:0;background:rgba(2,6,18,.94);z-index:100;display:none;
  align-items:center;justify-content:center;padding:16px;overflow:auto}
.modal.show{display:flex}
.modal img{max-width:100%;max-height:88vh;border-radius:10px}
.close{position:fixed;top:14px;right:16px;background:var(--panel);border:1px solid var(--line);
  color:var(--txt);border-radius:9px;padding:8px 13px;cursor:pointer;font-size:14px;z-index:2}
/* notes reader */
.nmodal{position:fixed;inset:0;background:var(--bg);z-index:90;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.nmodal.show{display:block}
.nhead{position:sticky;top:0;background:rgba(13,20,38,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding:12px 16px;display:flex;gap:10px;align-items:center;z-index:1}
.nhead .ttl{flex:1;min-width:0;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nhead .k{font-size:11px;color:var(--dim)}
.nhead button{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13px;white-space:nowrap}
.nbody{max-width:760px;margin:0 auto;padding:18px 18px 140px;font-size:15.5px;line-height:1.65}
.nbody p{margin:0 0 12px}
.n-h2{font-size:14px;color:var(--accent2);font-weight:600;margin:4px 0 14px;line-height:1.45}
.n-h3{font-size:16px;color:var(--accent);margin:22px 0 8px}
.n-story{border-left:3px solid #8e44ad;padding:6px 12px;margin:0 0 14px;font-style:italic;color:#d8dcf0;background:rgba(142,68,173,.08);border-radius:0 8px 8px 0}
.n-case{border-left:3px solid #e05252;padding:5px 12px;margin:8px 0;font-size:14.5px;background:rgba(224,82,82,.07);border-radius:0 8px 8px 0}
.n-case b{color:#ff8a8a}
.n-tip{border-left:3px solid #3b82f6;padding:5px 12px;margin:8px 0;font-size:14.5px;background:rgba(59,130,246,.08);border-radius:0 8px 8px 0}
.n-tip b{color:#7fb3ff;margin-right:6px}
.n-dig{border-left:3px solid #1d9e75;padding:5px 12px;margin:8px 0;font-size:14.5px;background:rgba(29,158,117,.08);border-radius:0 8px 8px 0}
.n-dig b{color:#5fd3ab;margin-right:6px}
.n-sec{padding:3px 0 3px 10px;margin:4px 0;font-size:14.5px}
.n-sec b{color:var(--accent2)}
.n-tblwrap{overflow-x:auto;margin:10px 0 16px}
.nbody table{border-collapse:collapse;font-size:13px;min-width:100%}
.nbody th,.nbody td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.nbody th{background:var(--panel2);color:var(--accent2)}
footer{color:var(--dim);font-size:11.5px;text-align:center;padding:10px 16px 4px}
@media(max-width:520px){.s{display:none}.t{font-size:14.5px}.nbody{font-size:15px}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Padala <span>Law</span></h1>
  <div class="sub">LL.B (AKNU) · story-based Telugu audio + exam notes · legal terms in English</div>
</div></header>

<div class="wrap">
  <div class="resume" id="resume"></div>
  <div class="semtabs" id="semtabs"></div>
  <div class="tabs" id="tabs"></div>
  <div class="subhead" id="subhead"></div>
  <div class="list" id="list"></div>
  <footer id="foot"></footer>
</div>

<div class="player"><div class="pinner">
  <div class="now" id="now">Select a topic to begin</div>
  <div class="nowsub" id="nowsub">Nothing playing</div>
  <audio id="au" controls preload="metadata"></audio>
  <div class="tools">
    <span id="speedlbl">Speed 1×</span>
    <span>
      <button class="lang" id="langbtn" onclick="toggleLang()" hidden>Telugu</button>
      <button onclick="setSpeed(-1)">slower</button>
      <button onclick="setSpeed(1)">faster</button>
      <button onclick="resetAll()">reset progress</button>
    </span>
  </div>
</div></div>

<div class="modal" id="modal">
  <button class="close" onclick="hideImg()">Close ✕</button>
  <img id="mimg" alt="Revision infographic">
</div>

<div class="nmodal" id="nmodal">
  <div class="nhead">
    <div style="flex:1;min-width:0"><div class="ttl" id="nttl"></div><div class="k" id="nkey"></div></div>
    <button id="nplay" onclick="playFromNotes()" hidden>▶ Play</button>
    <button onclick="hideNotes()">Close ✕</button>
  </div>
  <div class="nbody" id="nbody"></div>
</div>

<script src="data.js?v=2"></script>
<script>
const PKEY = 'padala.progress.v1', SKEY = 'padala.state.v1';
let prog = {}, state = {sem:'sem5', sid:'evidence', id:null, speed:1, lang:'te'};
let curId = null, curSid = null, speed = 1, notesCtx = null;

try{ prog  = JSON.parse(localStorage.getItem(PKEY) || '{}'); }catch(e){ prog = {}; }
try{ state = Object.assign(state, JSON.parse(localStorage.getItem(SKEY) || '{}')); }catch(e){}
// migrate old state that stored a subject index
if(!state.sid && typeof state.s === 'number' && SUBJECTS[state.s]) state.sid = SUBJECTS[state.s].id;
if(!SUBJECTS.some(s => s.id === state.sid)) state.sid = SEMESTERS[SEMESTERS.length-1].subjects[0].id;
state.sem = semOf(state.sid).id;
speed = state.speed || 1;
if(state.lang !== 'en') state.lang = 'te';

const semtabs=document.getElementById('semtabs'), tabs=document.getElementById('tabs'), list=document.getElementById('list'),
      subhead=document.getElementById('subhead'), au=document.getElementById('au'), resumeEl=document.getElementById('resume');

const saveProg  = () => { try{ localStorage.setItem(PKEY, JSON.stringify(prog)); }catch(e){} };
const saveState = () => { try{ localStorage.setItem(SKEY, JSON.stringify(state)); }catch(e){} };

function semOf(sid){ return SEMESTERS.find(m => m.subjects.some(s => s.id === sid)) || SEMESTERS[0]; }
function subj(){ return SUBJECTS.find(s => s.id === state.sid); }
function baseKey(sid,n){ return sid + '-' + n; }
function key(sid,n,lang){ return baseKey(sid,n) + ((lang||state.lang)==='en' ? '-en' : ''); }
function isDone(sid,n){ const b=baseKey(sid,n); return !!((prog[b]&&prog[b].done) || (prog[b+'-en']&&prog[b+'-en'].done)); }
function pct(p){ return (p && p.d) ? Math.min(100, Math.round(p.t / p.d * 100)) : 0; }
function fmt(sec){
  if(!sec || !isFinite(sec)) return '0:00';
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return m + ':' + String(s).padStart(2,'0');
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function findTopic(id){
  for(const s of SUBJECTS){
    const base = id.replace(/-en$/, '');
    const t = s.topics.find(t => baseKey(s.id,t.n) === base);
    if(t) return {s, t};
  }
  return null;
}
function subjDone(s){ return s.topics.filter(t => isDone(s.id,t.n)).length; }
function semDone(m){ return m.subjects.reduce((a,s)=>a+subjDone(s),0); }
function semTotal(m){ return m.subjects.reduce((a,s)=>a+s.topics.length,0); }
function audioSrc(s,t,lang){ return `audio/${s.id}/story-${t.n}${(lang||state.lang)==='en'?'-en':''}.m4a`; }

// ---- audio availability probe (one HEAD per subject+language) ----
const audioOK = {};
function probe(s){
  const k = s.id + ':' + state.lang;
  if(audioOK[k] !== undefined) return;
  audioOK[k] = null;
  fetch(audioSrc(s, s.topics[0]), {method:'HEAD', cache:'no-store'})
    .then(r => { audioOK[k] = r.ok; })
    .catch(() => { audioOK[k] = false; })
    .then(() => { if(state.sid === s.id) { drawSubhead(); drawList(); } });
}
function hasAudio(s){ const v = audioOK[s.id + ':' + state.lang]; return v === undefined || v === null ? null : v; }

// ---- notes (lazy-loaded notes/<id>.js) ----
const notesWait = {};
function notesOf(s){ return (window.NOTES && window.NOTES[s.id]) || null; }
function loadNotes(s, cb){
  if(!s.notes) return cb(false);
  if(notesOf(s)) return cb(true);
  if(notesWait[s.id]){ notesWait[s.id].push(cb); return; }
  notesWait[s.id] = [cb];
  const sc = document.createElement('script');
  sc.src = `notes/${s.id}.js?v=1`;
  const flush = ok => { (notesWait[s.id]||[]).forEach(f => f(ok)); delete notesWait[s.id]; };
  sc.onload = () => flush(true); sc.onerror = () => flush(false);
  document.head.appendChild(sc);
}

// ---- drawing ----
function drawSems(){
  semtabs.innerHTML = '';
  SEMESTERS.forEach(m => {
    const b = document.createElement('button');
    b.className = 'semtab' + (m.id===state.sem?' on':'');
    b.innerHTML = `<span>${esc(m.name)}</span><small>${m.subjects.length} subject${m.subjects.length!==1?'s':''} · ${semDone(m)} / ${semTotal(m)} done</small>`;
    b.onclick = () => { state.sem = m.id; state.sid = m.subjects[0].id; saveState(); drawAll(); };
    semtabs.appendChild(b);
  });
}
function drawTabs(){
  tabs.innerHTML = '';
  const m = SEMESTERS.find(x => x.id === state.sem);
  m.subjects.forEach(s => {
    const b = document.createElement('button');
    b.className = 'tab' + (s.id===state.sid?' on':'');
    b.innerHTML = `<span>${s.emoji}  ${esc(s.name)}</span><small>${subjDone(s)} / ${s.topics.length} done</small>`;
    b.onclick = () => { state.sid = s.id; saveState(); drawTabs(); drawSubhead(); drawList(); window.scrollTo({top:0,behavior:'smooth'}); };
    tabs.appendChild(b);
  });
}
function drawSubhead(){
  const s = subj(); probe(s);
  let h = `<span class="paper">${esc(s.paper)}</span>`;
  if(s.optional) h += `<span class="opt">${esc(s.optional)} — both options are hosted; study the one your college chose</span>`;
  const a = hasAudio(s);
  if(a === false) h += `<span class="warn">🎧 ${state.lang==='en'?'English':'Telugu'} audio not uploaded yet — notes are ready</span>`;
  const n = notesOf(s);
  if(n && n.extras.length) n.extras.forEach((x,i) => { h += `<span class="chip" onclick="openExtra(${i})">📝 ${esc(x.title.split('—')[0].trim())}</span>`; });
  else if(s.notes && !n) loadNotes(s, ok => { if(ok && state.sid===s.id){ drawSubhead(); drawList(); } });
  subhead.innerHTML = h;
}
function drawList(){
  const s = subj();
  const notes = notesOf(s);
  const a = hasAudio(s);
  list.innerHTML = '';
  s.topics.forEach(t => {
    const id = key(s.id,t.n), p = prog[id] || {}, pc = pct(p), done = isDone(s.id,t.n);
    const c = document.createElement('div');
    c.className = 'card' + (curId===id?' on':'') + (done?' done':'');
    let stat = '';
    if(done) stat = `<div class="stat"><b>✓ completed</b>${p.d?' · '+fmt(p.d):''}</div>`;
    else if(p.t > 15) stat = `<div class="stat"><b>${pc}% listened</b> · resume at ${fmt(p.t)}</div>`;
    else if(a === false) stat = `<div class="stat"><span class="soon">🎧 audio coming soon</span>${s.notes?' · tap to read the notes':''}</div>`;
    const hasN = !!(notes && notes.episodes[t.n]) || (s.notes && !notes);
    c.innerHTML = `<div class="num">${done?'✓':t.n}</div>
      <div class="meta"><div class="t">${esc(t.t)}</div><div class="s">${esc(t.s)}</div>${stat}</div>
      <div class="btns">${hasN?`<div class="ic" data-act="notes">📝 notes</div>`:''}<div class="ic" data-act="img">📊</div></div>
      <div class="bar" style="width:${pc}%"></div>`;
    c.onclick = e => {
      const act = e.target.dataset.act;
      if(act === 'img'){ showImg(s.id,t); return; }
      if(act === 'notes'){ openNotes(s,t); return; }
      if(a === false && s.notes){ openNotes(s,t); return; }
      play(s,t);
    };
    list.appendChild(c);
  });
  drawFooter();
}
function drawFooter(){
  const total = SUBJECTS.reduce((a,s)=>a+s.topics.length,0);
  const done  = SUBJECTS.reduce((a,s)=>a+subjDone(s),0);
  document.getElementById('foot').textContent =
    `${done} of ${total} episodes completed · progress saved on this device`;
}
function drawResume(){
  if(!state.id || state.id===curId){ resumeEl.classList.remove('show'); return; }
  const f = findTopic(state.id); if(!f){ resumeEl.classList.remove('show'); return; }
  const p = prog[state.id] || {};
  if(p.done || !(p.t > 15)){ resumeEl.classList.remove('show'); return; }
  const lang = /-en$/.test(state.id) ? 'en' : 'te';
  resumeEl.innerHTML = `<div class="lbl">Continue where you left off</div>
    <div class="ttl">${f.t.n}. ${esc(f.t.t)}</div>
    <div class="meta">${esc(f.s.name)}${lang==='en'?' · English':''} · ${pct(p)}% · resume at ${fmt(p.t)}</div>`;
  resumeEl.onclick = () => { state.lang = lang; state.sid = f.s.id; state.sem = semOf(f.s.id).id; saveState(); drawAll(); play(f.s, f.t); };
  resumeEl.classList.add('show');
}
function drawLang(){
  const b = document.getElementById('langbtn');
  const s = subj();
  b.hidden = !s.en;
  b.textContent = state.lang==='en' ? 'English ⇄' : 'Telugu ⇄';
}
function drawAll(){ drawSems(); drawTabs(); drawSubhead(); drawList(); drawResume(); drawLang(); }

// ---- playback ----
function play(s,t){
  const id = key(s.id,t.n);
  curId = id; curSid = s.id; state.id = id; state.sid = s.id; saveState();
  au.src = audioSrc(s,t);
  au.playbackRate = speed;
  const p = prog[id];
  au.onloadedmetadata = () => {
    if(!prog[id]) prog[id] = {t:0,d:0,done:false};
    prog[id].d = au.duration;
    if(p && p.t > 15 && !p.done && p.t < au.duration - 20) au.currentTime = p.t;
    au.playbackRate = speed;
  };
  au.onerror = () => {
    audioOK[s.id + ':' + state.lang] = false;
    document.getElementById('nowsub').textContent = `${s.name} · ${state.lang==='en'?'English':'Telugu'} audio not uploaded yet`;
    drawSubhead(); drawList();
  };
  document.getElementById('now').textContent = `${t.n}. ${t.t}`;
  document.getElementById('nowsub').textContent = s.name + (state.lang==='en' ? ' · English' : '');
  au.play().catch(()=>{});
  drawList(); drawResume();
}

let tick = 0;
au.addEventListener('timeupdate', () => {
  if(!curId || !au.duration) return;
  const p = prog[curId] || (prog[curId] = {t:0,d:0,done:false});
  p.t = au.currentTime; p.d = au.duration;
  if(!p.done && au.currentTime / au.duration > 0.92){ p.done = true; drawSems(); drawTabs(); drawList(); }
  if(Date.now() - tick > 5000){ tick = Date.now(); saveProg(); updateBar(); }
});
function updateBar(){
  const c = list.querySelector('.card.on .bar');
  if(c && prog[curId]) c.style.width = pct(prog[curId]) + '%';
}
['pause','ended'].forEach(ev => au.addEventListener(ev, saveProg));
window.addEventListener('beforeunload', () => { saveProg(); saveState(); });
document.addEventListener('visibilitychange', () => { if(document.hidden) saveProg(); });

au.addEventListener('ended', () => {
  if(curId && prog[curId]){ prog[curId].done = true; prog[curId].t = prog[curId].d || 0; saveProg(); }
  const s = SUBJECTS.find(x => x.id === curSid) || subj();
  const i = s.topics.findIndex(t => key(s.id,t.n) === curId);
  drawSems(); drawTabs();
  if(i > -1 && i < s.topics.length-1) play(s, s.topics[i+1]); else drawList();
});

function toggleLang(){
  state.lang = state.lang==='en' ? 'te' : 'en'; saveState();
  drawLang(); drawSubhead(); drawList();
  if(curId){ const f = findTopic(curId); if(f && f.s.id===subj().id) play(f.s, f.t); }
}
function setSpeed(dir){
  const steps = [0.75,1,1.25,1.5,1.75,2];
  let i = steps.indexOf(speed); if(i<0) i = 1;
  i = Math.max(0, Math.min(steps.length-1, i + dir));
  speed = steps[i]; au.playbackRate = speed; state.speed = speed; saveState();
  document.getElementById('speedlbl').textContent = 'Speed ' + speed + '×';
}
function resetAll(){
  if(!confirm('Clear all listening progress on this device?')) return;
  prog = {}; state.id = null; curId = null;
  saveProg(); saveState(); drawAll();
}

// ---- infographic ----
function showImg(id,t){
  const m = document.getElementById('modal'), im = document.getElementById('mimg');
  im.onerror = () => { im.removeAttribute('src'); im.alt = 'Infographic for this topic is not uploaded yet.'; };
  im.alt = 'Revision infographic';
  im.src = `img/${id}/story-${t.n}.jpg`;
  m.classList.add('show');
}
function hideImg(){ document.getElementById('modal').classList.remove('show'); }
document.getElementById('modal').onclick = e => { if(e.target.id==='modal') hideImg(); };

// ---- notes reader ----
function showNotesHtml(title, keyline, html, ctx){
  notesCtx = ctx || null;
  document.getElementById('nttl').textContent = title;
  document.getElementById('nkey').textContent = keyline;
  document.getElementById('nbody').innerHTML = html;
  document.getElementById('nplay').hidden = !(ctx && hasAudio(ctx.s) !== false);
  const m = document.getElementById('nmodal');
  m.classList.add('show'); m.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
function openNotes(s,t){
  loadNotes(s, ok => {
    const n = ok && notesOf(s), ep = n && n.episodes[t.n];
    if(!ep){ showNotesHtml(t.t, s.name, '<p>Notes for this episode are not uploaded yet.</p>', {s,t}); return; }
    showNotesHtml(`${t.n}. ${ep.title}`, `${s.name} · ${s.paper}`, ep.html, {s,t});
  });
}
function openExtra(i){
  const s = subj(), n = notesOf(s); if(!n || !n.extras[i]) return;
  showNotesHtml(n.extras[i].title, `${s.name} · ${s.paper}`, n.extras[i].html, null);
}
function hideNotes(){ document.getElementById('nmodal').classList.remove('show'); document.body.style.overflow = ''; }
function playFromNotes(){ if(notesCtx){ play(notesCtx.s, notesCtx.t); hideNotes(); } }
document.addEventListener('keydown', e => { if(e.key==='Escape'){ hideImg(); hideNotes(); } });

document.getElementById('speedlbl').textContent = 'Speed ' + speed + '×';
drawAll();
</script>
</body>
