<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Padala Law — LL.B Audio Revision</title>
<meta name="description" content="Story-based Telugu audio revision for LL.B semester IV: International Law, Labour Law, Taxation, IPR and Land Laws.">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
<style>
:root{
  --bg:#0b1120; --panel:#111a2e; --panel2:#16223c; --line:#22304f;
  --txt:#e8eefc; --dim:#94a3c4; --accent:#facc15; --accent2:#38bdf8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Telugu",sans-serif;
  padding-bottom:110px;line-height:1.5}
header{padding:22px 18px 14px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#101a30,#0b1120)}
h1{margin:0;font-size:21px;letter-spacing:.3px}
h1 span{color:var(--accent)}
.sub{color:var(--dim);font-size:13px;margin-top:4px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--dim);
  padding:9px 14px;border-radius:999px;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:.15s}
.tab:hover{border-color:#3b4d78}
.tab.on{background:var(--accent);color:#111;border-color:var(--accent);font-weight:600}
.list{padding:4px 0 20px}
.card{display:flex;gap:13px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);
  border-radius:13px;padding:13px 14px;margin-bottom:9px;cursor:pointer;transition:.15s}
.card:hover{background:var(--panel2);border-color:#3b4d78}
.card.on{border-color:var(--accent);background:var(--panel2)}
.num{flex:0 0 34px;height:34px;border-radius:9px;background:#1e2b4a;color:var(--accent2);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.card.on .num{background:var(--accent);color:#111}
.meta{flex:1;min-width:0}
.t{font-weight:600;font-size:15px;margin-bottom:2px}
.s{color:var(--dim);font-size:12.5px}
.ic{flex:0 0 auto;color:var(--dim);font-size:11px;border:1px solid var(--line);
  border-radius:6px;padding:3px 7px;margin-top:3px}
.ic:hover{color:var(--accent);border-color:var(--accent)}
.player{position:fixed;left:0;right:0;bottom:0;background:rgba(13,20,38,.97);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:11px 16px 16px;z-index:50}
.pinner{max-width:900px;margin:0 auto}
.now{font-size:13.5px;font-weight:600;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nowsub{font-size:11.5px;color:var(--dim);margin-bottom:8px}
audio{width:100%;height:38px}
.empty{color:var(--dim);text-align:center;padding:34px 10px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(2,6,18,.93);z-index:100;display:none;
  align-items:center;justify-content:center;padding:16px;overflow:auto}
.modal.show{display:flex}
.modal img{max-width:100%;max-height:88vh;border-radius:10px}
.close{position:fixed;top:14px;right:16px;background:var(--panel);border:1px solid var(--line);
  color:var(--txt);border-radius:9px;padding:8px 13px;cursor:pointer;font-size:14px}
footer{color:var(--dim);font-size:11.5px;text-align:center;padding:12px 16px 4px}
@media(max-width:520px){.s{display:none}.t{font-size:14.5px}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Padala <span>Law</span></h1>
  <div class="sub">LL.B Semester IV · story-based Telugu audio revision · legal terms in English</div>
</div></header>

<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="list" id="list"></div>
  <footer>50 episodes · ~17 hours · tap a topic to play, 📊 for the revision chart</footer>
</div>

<div class="player"><div class="pinner">
  <div class="now" id="now">Select a topic to begin</div>
  <div class="nowsub" id="nowsub">Nothing playing</div>
  <audio id="au" controls preload="none"></audio>
</div></div>

<div class="modal" id="modal">
  <button class="close" onclick="hideImg()">Close ✕</button>
  <img id="mimg" alt="Revision infographic">
</div>

<script src="data.js"></script>
<script>
let cur = 0, curTopic = null;
const tabs = document.getElementById('tabs'),
      list = document.getElementById('list'),
      au   = document.getElementById('au');

function drawTabs(){
  tabs.innerHTML = '';
  SUBJECTS.forEach((s,i)=>{
    const b = document.createElement('button');
    b.className = 'tab' + (i===cur?' on':'');
    b.textContent = s.emoji + '  ' + s.name;
    b.onclick = ()=>{ cur = i; drawTabs(); drawList(); window.scrollTo({top:0,behavior:'smooth'}); };
    tabs.appendChild(b);
  });
}

function drawList(){
  const s = SUBJECTS[cur];
  list.innerHTML = '';
  if(!s.topics.length){ list.innerHTML = '<div class="empty">Coming soon.</div>'; return; }
  s.topics.forEach(t=>{
    const c = document.createElement('div');
    c.className = 'card' + (curTopic===s.id+t.n?' on':'');
    c.innerHTML = `<div class="num">${t.n}</div>
      <div class="meta"><div class="t">${t.t}</div><div class="s">${t.s}</div></div>
      <div class="ic" data-img="1">📊</div>`;
    c.onclick = e=>{
      if(e.target.dataset.img){ showImg(s.id,t); return; }
      play(s,t);
    };
    list.appendChild(c);
  });
}

function play(s,t){
  curTopic = s.id + t.n;
  au.src = `audio/${s.id}/story-${t.n}.m4a`;
  document.getElementById('now').textContent = `${t.n}. ${t.t}`;
  document.getElementById('nowsub').textContent = s.name;
  au.play().catch(()=>{});
  drawList();
  try{ localStorage.setItem('last', JSON.stringify({s:cur,n:t.n})); }catch(e){}
}

function showImg(id,t){
  const m = document.getElementById('modal'), im = document.getElementById('mimg');
  im.onerror = ()=>{ im.alt = 'Infographic for this topic is not uploaded yet.'; };
  im.src = `img/${id}/story-${t.n}.jpg`;
  m.classList.add('show');
}
function hideImg(){ document.getElementById('modal').classList.remove('show'); }
document.getElementById('modal').onclick = e=>{ if(e.target.id==='modal') hideImg(); };
document.addEventListener('keydown', e=>{ if(e.key==='Escape') hideImg(); });

// auto-advance to next topic
au.addEventListener('ended', ()=>{
  const s = SUBJECTS[cur];
  const i = s.topics.findIndex(t=>s.id+t.n===curTopic);
  if(i > -1 && i < s.topics.length-1) play(s, s.topics[i+1]);
});

// restore last subject
try{
  const l = JSON.parse(localStorage.getItem('last')||'null');
  if(l && SUBJECTS[l.s]) cur = l.s;
}catch(e){}

drawTabs(); drawList();
</script>
</body>
</html>
